</style></head><body><aside class="side"><div class="brand">spend<i>yy</i><small>PERSONAL FINANCE</small></div><label>WORKSPACE</label><nav class="nav" id="nav"></nav><div class="sidefoot"><b>Private by design</b><br>Your financial records stay in this browser. No backend or cloud database.</div></aside><main class="main"><header class="top"><small>Spendyy / <b id="crumb">Overview</b></small><div class="actions"><button class="btn secondary" id="backup">↓ Backup</button><button class="btn primary" id="quick">＋ Add transaction</button></div></header><div class="content"><div class="heading"><div><div class="eyebrow">YOUR MONEY, IN CONTROL</div><h1 id="title">Good to see you.</h1><div class="muted" id="subtitle">Know what is yours to spend — and what is already committed.</div></div><div class="muted" id="today"></div></div><div id="view"></div></div></main><nav class="mobilebar" id="mobile"></nav><div id="modalroot"></div><script type="module">
const DB='spendyy-v1';let db;const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>{const d=req.result;for(const [n,idx] of [['loans',['type','status','dueDate']],['payments',['loanId','date']],['transactions',['type','date']],['settings',[]]]){if(!d.objectStoreNames.contains(n)){const s=d.createObjectStore(n,{keyPath:'id'});idx.forEach(k=>s.createIndex(k,k))}}};req.onsuccess=()=>{db=req.result;render()};req.onerror=()=>alert('Local database could not be opened. Please use a supported browser.');
const $=s=>document.querySelector(s),all=n=>new Promise((ok,no)=>{const r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),put=(n,v)=>new Promise((ok,no)=>{const r=db.transaction(n,'readwrite').objectStore(n).put(v);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)}),del=(n,id)=>new Promise(ok=>{const r=db.transaction(n,'readwrite').objectStore(n).delete(id);r.onsuccess=()=>ok()});
const id=()=>crypto.randomUUID(),today=()=>new Date().toISOString().slice(0,10),cash=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n||0),date=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}),days=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
let tab='Overview',loans=[],payments=[],txs=[],budget=5000;
const names=['Overview','Loans','Activity','Reports','Settings'];const icons=['▦','▣','↔','▥','⚙'];
function nav(){const html=names.map((n,i)=>'<button class="'+(tab===n?'active':'')+'" data-tab="'+n+'">'+icons[i]+'　'+n+'</button>').join('');$('#nav').innerHTML=html;$('#mobile').innerHTML=names.slice(0,4).map((n,i)=>'<button class="'+(tab===n?'active':'')+'" data-tab="'+n+'">'+icons[i]+'<span>'+n+'</span></button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function remaining(l){const ps=payments.filter(p=>p.loanId===l.id&&p.kind!=='fee').reduce((s,p)=>s+p.amount,0);return l.type==='emi'?Math.max(0,l.totalInstallments-l.paidInstallments)*l.emiAmount:Math.max(0,l.repayment-ps)}
function stats(){const active=loans.filter(l=>l.status==='active'),cashNow=txs.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),0),reserve=active.reduce((s,l)=>s+remaining(l),0),m=today().slice(0,7),mt=txs.filter(t=>t.date.startsWith(m)),income=mt.filter(t=>t.type==='income'&&t.source!=='loan').reduce((s,t)=>s+t.amount,0),expense=mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),paid=payments.filter(p=>p.date.startsWith(m)&&p.kind!=='fee').reduce((s,p)=>s+p.amount,0);return{active,cashNow,reserve,spend:Math.max(0,cashNow-reserve),income,expense,paid}}
function render(){if(!db)return;Promise.all([all('loans'),all('payments'),all('transactions'),all('settings')]).then(([l,p,t,s])=>{loans=l;payments=p;txs=t;budget=s.find(x=>x.id==='budget')?.value??5000;draw()})}
function draw(){nav();$('#crumb').textContent=tab;$('#title').textContent=tab==='Overview'?'Good to see you.':tab;$('#subtitle').textContent=({Overview:'Know what is yours to spend — and what is already committed.',Loans:'Track every EMI, one-time loan, due date and repayment.',Activity:'Every rupee in and out, recorded in one place.',Reports:'A clear picture of your cash flow and repayments.',Settings:'Your preferences and private data controls.'})[tab];$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});const s=stats();let html='';
if(tab==='Overview'){const up=s.active.map(l=>({l,d:l.type==='emi'?l.nextDate||l.dueDate:l.dueDate})).sort((a,b)=>a.d.localeCompare(b.d));html='<section class="hero"><div class="balance"><small>ACTUAL CASH BALANCE</small><h2>'+cash(s.cashNow)+'</h2><p>Recorded income minus recorded expenses</p><div class="split"><div><span>Reserved for loans</span><b>'+cash(s.reserve)+'</b></div><div><span>Spendable balance</span><b style="color:#7de0b5">'+cash(s.spend)+'</b></div></div></div><div class="spend"><small>YOUR SAFE SPENDING LIMIT</small><h2>'+cash(s.spend)+'</h2><p>Outstanding loan payments are kept aside first. Use this available amount carefully for essential needs.</p></div></section><section class="stats"><div class="stat"><small>Income this month</small><b>'+cash(s.income)+'</b></div><div class="stat"><small>Expenses this month</small><b>'+cash(s.expense)+'</b></div><div class="stat"><small>Loan payments this month</small><b>'+cash(s.paid)+'</b></div><div class="stat"><small>Active loans</small><b>'+s.active.length+'</b></div></section><div class="twocol"><section class="panel"><div class="panelhead"><div><h3>Upcoming payments</h3><p>Loan due dates and amounts</p></div><button class="btn secondary" data-go="Loans">All loans →</button></div>'+(up.length?up.slice(0,6).map(({l,d})=>'<div class="row"><div class="datebox"><b>'+new Date(d+'T00:00:00').getDate()+'</b><small>'+new Date(d+'T00:00:00').toLocaleDateString('en-IN',{month:'short'}).toUpperCase()+'</small></div><div class="grow"><b>'+esc(l.name)+'</b><small>'+(l.type==='emi'?'EMI':'One-time')+' · '+(days(d)<0?'Overdue':days(d)===0?'Due today':'Due in '+days(d)+' days')+'</small></div><b>'+cash(l.type==='emi'?l.emiAmount:remaining(l))+'</b><button class="btn secondary" data-pay="'+l.id+'">Paid</button></div>').join(''):'<div class="empty"><b>No loans added yet</b>Add your first loan to start tracking.</div>')+'</section><section class="panel"><div class="panelhead"><div><h3>Quick actions</h3><p>Update your records</p></div></div><div class="row"><button class="btn primary" data-modal="loan">＋ Add new loan</button></div><div class="row"><button class="btn secondary" data-modal="income">＋ Add income</button></div><div class="row"><button class="btn secondary" data-modal="expense">＋ Add expense</button></div></section></div><section class="panel"><div class="panelhead"><div><h3>Recent activity</h3><p>Latest transactions</p></div><button class="btn secondary" data-go="Activity">View all →</button></div>'+txTable(txs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))+'</section>'}
if(tab==='Loans'){html='<section class="panel"><div class="panelhead"><div><h3>Your loans · '+s.active.length+' active</h3><p>EMI and one-time loans are tracked separately.</p></div><button class="btn primary" data-modal="loan">＋ Add loan</button></div>'+(loans.length?'<div class="cards">'+loans.slice().reverse().map(l=>loanCard(l)).join('')+'</div>':'<div class="empty"><b>No loans recorded</b>Add every active loan to calculate the money you need to reserve.</div>')+'</section>'}
if(tab==='Activity'){html='<section class="panel"><div class="panelhead"><div><h3>All transactions</h3><p>'+txs.length+' entries on this device</p></div><button class="btn primary" data-modal="income">＋ Add transaction</button></div>'+txTable(txs.slice().sort((a,b)=>b.date.localeCompare(a.date)))+'</section>'}
if(tab==='Reports'){const allIn=txs.filter(t=>t.type==='income'&&t.source!=='loan').reduce((a,t)=>a+t.amount,0),allOut=txs.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),allPay=payments.filter(p=>p.kind!=='fee').reduce((a,p)=>a+p.amount,0);html='<section class="stats"><div class="stat"><small>Total income</small><b>'+cash(allIn)+'</b></div><div class="stat"><small>Everyday expenses</small><b>'+cash(allOut)+'</b></div><div class="stat"><small>Loan repayments</small><b>'+cash(allPay)+'</b></div><div class="stat"><small>Loan balance reserved</small><b>'+cash(s.reserve)+'</b></div></section><section class="panel"><h3>This month</h3><p class="muted">'+new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</p>'+bar('Income',s.income,Math.max(s.income,s.expense,1),'#15966c')+bar('Expenses',s.expense,Math.max(s.income,s.expense,1),'#e6a16c')+bar('Loan payments',s.paid,Math.max(s.income,s.expense,s.paid,1),'#7893c4')+'<p class="muted">Loan disbursements are not counted as income. Loan repayments are shown separately from everyday expenses.</p></section>'}
if(tab==='Settings'){html='<section class="panel"><h3>Monthly essential expense budget</h3><p class="muted">Default ₹5,000. This is a limit, not an automatic expense.</p><form id="budgetform" class="row"><input name="budget" type="number" min="0" value="'+budget+'" style="max-width:180px;padding:10px;border:1px solid #dfe6ed;border-radius:8px"><button class="btn primary">Save budget</button></form></section><section class="panel"><h3>Backup & restore</h3><p class="muted">Your records are stored only on this device. Export a backup regularly.</p><button class="btn primary" id="backup2">↓ Export JSON backup</button> <label class="btn secondary">↑ Restore backup<input type="file" id="restore" accept=".json,application/json" hidden></label><div class="notice">Important: Clearing Safari website data, removing the PWA or changing devices can erase local records. Save backups to Files/iCloud Drive. There is no automatic cloud backup.</div></section><section class="panel"><h3>Privacy</h3><p class="muted">Vercel hosts the app files only. Loan and transaction records are stored in IndexedDB on this device. No login, backend, Supabase, Firebase or cloud database is used.</p></section>'}
$('#view').innerHTML=html;document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;draw()});document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>openModal('payment',b.dataset.pay));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this loan and its payment history?')){const lid=b.dataset.del;await del('loans',lid);for(const p of payments.filter(x=>x.loanId===lid))await del('payments',p.id);for(const t of txs.filter(x=>x.loanId===lid))await del('transactions',t.id);render()}});$('#budgetform')?.addEventListener('submit',async e=>{e.preventDefault();await put('settings',{id:'budget',value:Number(new FormData(e.target).get('budget'))||0});render()});$('#backup2')?.addEventListener('click',backup);$('#restore')?.addEventListener('change',e=>restore(e.target.files[0]))}
function loanCard(l){const rem=remaining(l),paid=l.type==='emi'?l.paidInstallments:payments.filter(p=>p.loanId===l.id&&p.kind!=='fee').reduce((s,p)=>s+p.amount,0),progress=l.type==='emi'?paid/Math.max(l.totalInstallments,1)*100:paid/Math.max(l.repayment,1)*100;return '<article class="card"><div class="cardtop"><span class="pill">'+(l.type==='emi'?'MONTHLY EMI':'ONE-TIME')+'</span><button class="btn danger" data-del="'+l.id+'">Delete</button></div><h3>'+esc(l.name)+'</h3><div class="big">'+cash(rem)+'</div><div class="muted">Remaining scheduled amount</div><div class="progress"><i style="width:'+Math.min(100,progress)+'%"></i></div><div class="between"><span>'+(l.type==='emi'?l.paidInstallments+'/'+l.totalInstallments+' instalments paid':'Due '+date(l.dueDate))+'</span><b>'+Math.round(progress)+'%</b></div><div class="details"><span>Loan amount<b>'+cash(l.principal)+'</b></span><span>'+(l.type==='emi'?'Monthly EMI':'Payoff amount')+'<b>'+cash(l.type==='emi'?l.emiAmount:l.repayment)+'</b></span></div><button class="btn primary" style="width:100%;margin-top:14px" data-pay="'+l.id+'">Record payment</button></article>'}
function txTable(list){if(!list.length)return '<div class="empty"><b>No transactions yet</b>Record salary, freelance income and daily expenses.</div>';return '<div class="tablewrap"><table><thead><tr><th>TRANSACTION</th><th>DATE</th><th>CATEGORY</th><th>AMOUNT</th></tr></thead><tbody>'+list.map(t=>'<tr><td><b>'+esc(t.note||t.category)+'</b><small>'+(t.type==='income'?'Money received':'Money spent')+'</small></td><td>'+date(t.date)+'</td><td>'+esc(t.category)+'</td><td class="'+(t.type==='income'?'in':'out')+'">'+(t.type==='income'?'+':'−')+cash(t.amount)+'</td></tr>').join('')+'</tbody></table></div>'}
function bar(label,v,max,color){return '<div style="margin:18px 0"><div class="between" style="margin-bottom:7px"><span>'+label+'</span><b>'+cash(v)+'</b></div><div class="progress"><i style="width:'+Math.max(v?2:0,v/max*100)+'%;background:'+color+'"></i></div></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(type,loanId){let l=loans.find(x=>x.id===loanId);let body='';if(type==='loan')body='<form id="loanform" class="form"><label class="full">Loan app / provider<input name="name" required placeholder="Loan app name"></label><div class="full"><label>Loan type</label><div class="switch"><button type="button" class="sel" data-type="emi">EMI · monthly instalments</button><button type="button" data-type="one-time">One-time · full repayment</button></div><input type="hidden" name="type" value="emi"></div><label>Sanctioned amount (₹)<input name="principal" type="number" min="1" step=".01" required></label><label>Net amount received (₹)<input name="received" type="number" min="0" step=".01" placeholder="Defaults to sanctioned"></label><label>Processing fee (₹)<input name="fee" type="number" min="0" step=".01" value="0"></label><label>Loan date<input name="startDate" type="date" value="'+today()+'" required></label><div id="emifields" class="full" style="display:contents"><label>Monthly EMI (₹)<input name="emiAmount" type="number" min="1" step=".01"></label><label>Number of instalments / months<input name="totalInstallments" type="number" min="1" value="12"></label><label>First EMI date<input name="firstDate" type="date" value="'+today()+'"></label><label>Monthly due day (1–31)<input name="emiDay" type="number" min="1" max="31" value="5"></label></div><div id="onetimefields" class="full hidden" style="display:contents"><label>Full repayment amount (₹)<input name="repayment" type="number" min="1" step=".01"></label><label>Duration (months)<input name="duration" type="number" min="1" value="1"></label><label class="full">Exact due date<input name="dueDate" type="date" value="'+today()+'"></label></div><label class="full">Notes<textarea name="notes" placeholder="Optional loan details or renewal terms"></textarea></label><div class="foot full"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn primary">Save loan</button></div></form>';
if(type==='income'||type==='expense')body='<form id="txform" class="form"><div class="full"><div class="switch"><button type="button" class="'+(type==='income'?'sel':'')+'" data-txtype="income">Income</button><button type="button" class="'+(type==='expense'?'sel':'')+'" data-txtype="expense">Expense</button></div><input type="hidden" name="type" value="'+type+'"></div><label>Amount (₹)<input name="amount" type="number" min=".01" step=".01" required></label><label>Date<input name="date" type="date" value="'+today()+'" required></label><label>Category<select name="category">'+(type==='income'?'<option>Salary</option><option>Freelance</option><option>Other income</option>':'<option>Food</option><option>Travel</option><option>Bills</option><option>Health</option><option>Shopping</option><option>Other</option>')+'</select></label><label>Note<input name="note" placeholder="Optional"></label><div class="foot full"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn primary">Save transaction</button></div></form>';
if(type==='payment'&&l)body='<form id="payform" class="form"><div class="full muted">'+esc(l.name)+' · Remaining '+cash(remaining(l))+'</div><label>Amount paid (₹)<input name="amount" type="number" min=".01" step=".01" required></label><label>Payment date<input name="date" type="date" value="'+today()+'" required></label><label class="full">Note<input name="note" placeholder="Payment reference"></label><div class="foot full"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn primary">Save payment</button></div></form>';
$('#modalroot').innerHTML='<div class="modalbg"><div class="modal"><div class="modalhead"><h2>'+(type==='loan'?'Add new loan':type==='payment'?'Record loan payment':'Add transaction')+'</h2><button class="close" data-close>✕</button></div>'+body+'</div></div>';document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modalroot').innerHTML='');$('.modalbg').onclick=e=>{if(e.target.classList.contains('modalbg'))$('#modalroot').innerHTML=''};
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('sel',x===b));const one=b.dataset.type==='one-time';$('#loanform [name=type]').value=b.dataset.type;$('#emifields').classList.toggle('hidden',one);$('#onetimefields').classList.toggle('hidden',!one);$('#loanform [name=emiAmount]').required=!one;$('#loanform [name=repayment]').required=one;});
document.querySelectorAll('[data-txtype]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-txtype]').forEach(x=>x.classList.toggle('sel',x===b));$('#txform [name=type]').value=b.dataset.txtype;const cat=$('#txform [name=category]');cat.innerHTML=b.dataset.txtype==='income'?'<option>Salary</option><option>Freelance</option><option>Other income</option>':'<option>Food</option><option>Travel</option><option>Bills</option><option>Health</option><option>Shopping</option><option>Other</option>'});
$('#loanform')?.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),one=f.type==='one-time';if(!one&&Number(f.emiAmount)*Number(f.totalInstallments)<=0)return alert('Enter EMI and instalments');const due=one?f.dueDate:f.firstDate;const loan={id:id(),name:f.name,type:f.type,principal:+f.principal,received:+f.received||+f.principal,fee:+f.fee||0,repayment:one?+f.repayment:+f.emiAmount*+f.totalInstallments,startDate:f.startDate,dueDate:due,nextDate:due,durationMonths:+f.duration||+f.totalInstallments,emiAmount:+f.emiAmount||0,emiDay:+f.emiDay||1,totalInstallments:one?1:+f.totalInstallments,paidInstallments:0,status:'active',notes:f.notes||''};await put('loans',loan);await put('transactions',{id:id(),type:'income',amount:loan.received,date:loan.startDate,category:'Loan received',note:'Loan disbursement · '+loan.name,source:'loan',loanId:loan.id});$('#modalroot').innerHTML='';render()});
$('#txform')?.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await put('transactions',{id:id(),...f,amount:+f.amount});$('#modalroot').innerHTML='';render()});
$('#payform')?.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),amount=+f.amount;if(amount<=0)return;if(l.type==='emi'&&amount!==l.emiAmount)return alert('Enter the exact EMI amount of '+cash(l.emiAmount)+'. Partial EMI allocation is not supported yet.');const rem=remaining(l);const kind=l.type==='emi'?'emi':amount>=rem?'one-time':'partial';await put('payments',{id:id(),loanId:l.id,amount,date:f.date,note:f.note,kind});if(l.type==='emi'){l.paidInstallments=Math.min(l.totalInstallments,l.paidInstallments+1);const d=new Date(l.nextDate+'T00:00:00');d.setMonth(d.getMonth()+1);l.nextDate=d.toISOString().slice(0,10);if(l.paidInstallments>=l.totalInstallments)l.status='closed';await put('loans',l)}else if(amount>=rem){l.status='closed';await put('loans',l)}$('#modalroot').innerHTML='';render()})}
async function backup(){const data={app:'Spendyy',version:1,exportedAt:new Date().toISOString(),loans:await all('loans'),payments:await all('payments'),transactions:await all('transactions'),settings:await all('settings')};const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='spendyy-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)}
async function restore(file){if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='Spendyy'||!Array.isArray(d.loans)||!Array.isArray(d.transactions)||!Array.isArray(d.payments))throw Error();if(!confirm('Import this backup? Matching records will be overwritten.'))return;for(const n of ['loans','payments','transactions','settings'])for(const v of d[n]||[])await put(n,v);render();alert('Backup restored')}catch{alert('This is not a valid Spendyy backup')}}
$('#backup').onclick=backup;$('#quick').onclick=()=>openModal('income');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));render();
</script></body></html>
