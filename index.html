async function backup(){const data={app:'Spendyy',version:1,exportedAt:new Date().toISOString(),loans:await all('loans'),payments:await all('payments'),transactions:await all('transactions'),settings:await all('settings')};const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='spendyy-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)}
async function restore(file){if(!file)return;try{const d=JSON.parse(await file.text());if(d.app!=='Spendyy'||!Array.isArray(d.loans)||!Array.isArray(d.transactions)||!Array.isArray(d.payments))throw Error();if(!confirm('Import this backup? Matching records will be overwritten.'))return;for(const n of ['loans','payments','transactions','settings'])for(const v of d[n]||[])await put(n,v);render();alert('Backup restored')}catch{alert('This is not a valid Spendyy backup')}}
$('#backup').onclick=backup;$('#quick').onclick=()=>openModal('income');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));render();
</script></body></html>
